services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # ":?" fails the deploy fast if these aren't set instead of silently
      # falling back to weak default credentials.
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only; the app/migrate services reach Postgres
      # over the internal Docker network, not via this published port.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off migration runner: applies pending Prisma migrations before the
  # app starts. Uses the `builder` stage (full node_modules incl. the
  # Prisma CLI) rather than the slim `runner` image.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      app:
        condition: service_healthy

  # One-off Certbot run to obtain TLS certs. Not started by default; run
  # explicitly once nginx is serving the ACME challenge path over HTTP:
  #   docker compose --profile tls run --rm certbot
  # Then uncomment the HTTPS server block in docker/nginx.conf and restart
  # nginx.
  certbot:
    image: certbot/certbot
    profiles: ["tls"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "certbot certonly --webroot -w /var/www/certbot -d ${DOMAIN:?Set DOMAIN in .env} --email ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env} --agree-tos --no-eff-email"

volumes:
  db-data:
  certbot-www:
  certbot-conf:
